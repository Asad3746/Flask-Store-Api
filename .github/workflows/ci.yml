name: CI + Postman Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node (LTS stable)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node Version
        run: node -v

      - name: Install Newman
        run: npm install -g newman

      - name: Wait for Render API
        run: |
          echo "Waiting for API..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-api-wks8.onrender.com || true)
            echo "Attempt $i -> $STATUS"

            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 404 ]; then
              echo "API is up"
              break
            fi

            sleep 5
          done

      - name: Run Postman Tests (FULL LOGS)
        run: |
          newman run postman_collection.json \
            -e postman_environment.json \
            --env-var "base_url=https://ecommerce-api-wks8.onrender.com" \
            --verbose \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-report
          path: results.xml