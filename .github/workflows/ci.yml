name: CI + Postman Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node 18 (MOST STABLE for Newman)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Verify Node
        run: node -v

      - name: Install Newman
        run: |
          npm install -g newman
          newman -v

      - name: Wait for Render API
        run: |
          echo "Checking API..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-api-wks8.onrender.com || true)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 404 ]; then
              echo "API ready"
              break
            fi
            sleep 5
          done

      - name: Run Postman Tests
        run: |
          newman run postman_collection.json \
            -e postman_environment.json \
            --env-var "base_url=https://ecommerce-api-wks8.onrender.com" \
            --verbose \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: results.xml