name: CI + Blue/Green Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── Job 1: Code Quality ───────────────────────────────────────
  code_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Static Code Analysis (Ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r . -lll

  # ─── Job 2: Test ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: code_quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Newman
        run: |
          npm install -g newman
          newman -v

      - name: Wait for Blue API
        run: |
          echo "Checking Blue API..."
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-api-wks8.onrender.com || true)
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 404 ]; then
              echo "Blue API ready"
              break
            fi
            sleep 10
          done

      - name: Clean up test data
        run: |
          echo "Cleaning up..."
          curl -s -X DELETE https://ecommerce-api-wks8.onrender.com/test/cleanup
          echo "Cleanup done"

      - name: Run Database Migrations (Flyway)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/flyway/migrations:/flyway/sql \
            flyway/flyway:latest \
            -url="jdbc:postgresql://dpg-d8hdqvk2m8qs73b1qlvg-a.singapore-postgres.render.com/flask_store_db_mxcn" \
            -user="flask_store_db_mxcn_user" \
            -password="${{ secrets.FLYWAY_DB_PASSWORD }}" \
            -locations="filesystem:/flyway/sql" \
            -baselineOnMigrate=true \
            -baselineVersion=0 \
            migrate

      - name: Run Postman Tests Against Blue
        run: |
          newman run postman_collection.json \
            -e postman_environment.json \
            --env-var "base_url=https://ecommerce-api-wks8.onrender.com" \
            --verbose \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: results.xml

  # ─── Job 3: Blue/Green Deployment ─────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1 - Deploy to GREEN
      - name: Deploy to GREEN
        run: |
          echo "Deploying to GREEN..."
          curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK_GREEN }}
          echo "GREEN deployment triggered"

      # Step 2 - Wait for GREEN to be ready
      - name: Wait for GREEN to be ready
        run: |
          echo "Waiting for GREEN to wake up..."
          for i in {1..24}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-api-green.onrender.com || true)
            echo "Attempt $i: GREEN status = $STATUS"
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 404 ]; then
              echo "GREEN is ready"
              break
            fi
            sleep 10
          done

      # Step 3 - Health check GREEN
      - name: Health Check GREEN
        id: health_check
        run: |
          echo "Running health check on GREEN..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://ecommerce-api-green.onrender.com/cart \
            -H "Content-Type: application/json" \
            -d '{"user_id": 99}')
          echo "Health check status: $RESPONSE"
          if [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 409 ]; then
            echo "GREEN health check passed ✅"
            echo "health=passed" >> $GITHUB_OUTPUT
          else
            echo "GREEN health check failed ❌"
            echo "health=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      # Step 4 - Run Postman Tests Against GREEN
      - name: Run Postman Tests Against GREEN
        run: |
          npm install -g newman
          newman run postman_collection.json \
            -e postman_environment.json \
            --env-var "base_url=https://ecommerce-api-green.onrender.com" \
            --verbose \
            --reporters cli,junit \
            --reporter-junit-export green-results.xml

      - name: Upload GREEN Test Report
        uses: actions/upload-artifact@v4
        with:
          name: green-postman-report
          path: green-results.xml

      # Step 5 - Promote GREEN to BLUE (swap)
      - name: Promote GREEN to BLUE
        if: success()
        run: |
          echo "All tests passed on GREEN ✅"
          echo "Promoting GREEN to BLUE..."
          curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BLUE }}
          echo "BLUE updated with new version ✅"
          echo "Blue/Green deployment complete 🎉"

      # Step 6 - Rollback if GREEN failed
      - name: Rollback to BLUE on failure
        if: failure()
        run: |
          echo "GREEN deployment failed ❌"
          echo "Rolling back to BLUE..."
          curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BLUE }}
          echo "Rollback complete ✅ BLUE is still live"
          exit 1